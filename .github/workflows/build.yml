name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Build Pojlib AAR
        run: ./scripts/build-pojlib.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Pojlib-release
          path: pojlib/build/outputs/aar/*.aar

  vivecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Build Vivecraft (Fabric)
        working-directory: vivecraft
        run: ./gradlew --no-daemon -Pplatforms=fabric :fabric:build -x test

      - uses: actions/upload-artifact@v4
        with:
          name: vivecraft-fabric
          path: vivecraft/build/libs/*-fabric.jar
