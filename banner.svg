<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="OpenCraft: Minecraft Java Edition in standalone VR">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- blocky ground -->
  <g>
    <rect x="0" y="300" width="1200" height="60" fill="#5b3a1e"/>
    <rect x="0" y="292" width="1200" height="16" fill="#3fa34d"/>
    <g fill="#348a40">
      <rect x="40" y="292" width="40" height="8"/><rect x="200" y="300" width="40" height="8"/>
      <rect x="360" y="292" width="40" height="8"/><rect x="520" y="300" width="40" height="8"/>
      <rect x="680" y="292" width="40" height="8"/><rect x="840" y="300" width="40" height="8"/>
      <rect x="1000" y="292" width="40" height="8"/><rect x="1120" y="300" width="40" height="8"/>
    </g>
    <g fill="#4a2f17">
      <rect x="120" y="324" width="40" height="20"/><rect x="440" y="332" width="40" height="20"/>
      <rect x="760" y="324" width="40" height="20"/><rect x="1060" y="332" width="40" height="20"/>
    </g>
  </g>

  <!-- headset mark: a cube seen through two lenses -->
  <g transform="translate(110 86)">
    <rect x="0" y="20" width="220" height="120" rx="34" fill="#0b132b" stroke="#e0e1dd" stroke-width="8"/>
    <rect x="90" y="122" width="40" height="22" fill="#14213d"/>
    <circle cx="62" cy="80" r="34" fill="#1f4e79" stroke="#e0e1dd" stroke-width="6"/>
    <circle cx="158" cy="80" r="34" fill="#1f4e79" stroke="#e0e1dd" stroke-width="6"/>
    <g transform="translate(62 80)">
      <path d="M0 -18 L16 -9 L0 0 L-16 -9 Z" fill="#7bd389"/>
      <path d="M-16 -9 L0 0 L0 18 L-16 9 Z" fill="#3fa34d"/>
      <path d="M16 -9 L0 0 L0 18 L16 9 Z" fill="#2b7a37"/>
    </g>
    <g transform="translate(158 80)">
      <path d="M0 -18 L16 -9 L0 0 L-16 -9 Z" fill="#7bd389"/>
      <path d="M-16 -9 L0 0 L0 18 L-16 9 Z" fill="#3fa34d"/>
      <path d="M16 -9 L0 0 L0 18 L16 9 Z" fill="#2b7a37"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="390" y="190" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="112" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#e0e1dd">Open<tspan fill="#7bd389">Craft</tspan></text>
  <text x="394" y="240" font-family="Helvetica, Arial, sans-serif" font-size="30" textLength="560" fill="#e0e1dd" fill-opacity="0.85">Minecraft: Java Edition in standalone VR</text>
</svg>
