// Modified for OpenCraft (2026-11-26): adds commons-compress/xz and a task that builds SDL3 from source.
plugins {
    id("com.android.library") version("7.4.2")
}

android {
    ndkVersion = "26.1.10909125"
    compileSdkVersion = "android-34"
    defaultConfig {
        minSdk 29
        multiDexEnabled true
        ndk.stl = "c++_shared"
        targetSdk 34
    }

    buildTypes {
        release {
            ndk.abiFilters.add("arm64-v8a")
        }
        debug {
            ndk.abiFilters.add("arm64-v8a")
        }
    }

    externalNativeBuild {
        ndkBuild {
            path(file("src/main/jni/Android.mk"))
        }
    }

    buildToolsVersion = "30.0.3"
}

build {
    //finalizedBy(':wrapper:launcher:build')
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api("org.apache.commons:commons-math3:3.6.1")

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation("com.google.guava:guava:31.0.1-jre")
}

dependencies {
    implementation("org.jetbrains:annotations:24.0.1")
    implementation("com.google.code.gson:gson:2.12.1")
    implementation("org.json:json:20220924")
    implementation("commons-io:commons-io:2.13.0")
    implementation("commons-codec:commons-codec:1.15")
    implementation("androidx.annotation:annotation:1.7.1")
    implementation("androidx.core:core:1.13.1")
    implementation("com.microsoft.azure:msal4j:1.17.0")
    implementation("com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3")
    implementation("blank:unity-classes")
    // OpenCraft: unpacking the Java 25 runtime (.tar.xz)
    implementation("org.apache.commons:commons-compress:1.21")
    implementation("org.tukaani:xz:1.9")
}

// OpenCraft: 26.x game versions need libSDL3.so with the offscreen video driver.
// It is built from the official SDL sources the first time; delete the file to rebuild.
def sdlLib = file("src/main/jniLibs/arm64-v8a/libSDL3.so")
tasks.register("buildSDL3", Exec) {
    onlyIf { !sdlLib.exists() }
    commandLine "bash", file("scripts/build-sdl3.sh").absolutePath, android.ndkDirectory.absolutePath, sdlLib.absolutePath
}
tasks.named("preBuild") { dependsOn("buildSDL3") }
