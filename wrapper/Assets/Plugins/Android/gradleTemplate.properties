org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
android.library=true
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
# OpenCraft: Jetifier only rewrites old Android support-library code, which Pojlib does not use.
# It cannot read the Java 25 classes Pojlib carries for 26.x game versions, so skip that AAR.
android.jetifier.ignorelist=Pojlib-release.*
