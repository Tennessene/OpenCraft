apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: "Pojlib-release", ext: "aar")

    // OpenCraft: Unity 2022.3's dexer (D8 4.0.52) crashes on some newer jars: xz 1.10,
    // json-smart 2.5.1 (from msal4j 1.17.2), commons-lang3 3.16 (from commons-compress 1.27)
    // and error_prone_annotations 2.36 (from gson). The versions below avoid them, and the
    // annotations are compile-time only, so they're left out.
    configurations.all { exclude group: "com.google.errorprone", module: "error_prone_annotations" }
    // OpenCraft: an AAR doesn't carry its dependencies, so every library Pojlib uses at
    // runtime is listed here. Keep this in step with pojlib/build.gradle.
    implementation("com.google.guava:guava:31.0.1-jre")
    implementation("com.google.code.gson:gson:2.12.1")
    implementation("org.apache.commons:commons-math3:3.6.1")
    implementation("commons-io:commons-io:2.13.0")
    implementation("commons-codec:commons-codec:1.15")
    implementation("androidx.annotation:annotation:1.7.1")
    implementation("androidx.core:core:1.13.1")
    implementation("com.microsoft.azure:msal4j:1.17.0")
    implementation("com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3")
    // used by Pojlib to unpack the Java 25 runtime for 26.x game versions
    implementation("org.apache.commons:commons-compress:1.21")
    implementation("org.tukaani:xz:1.9")
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
